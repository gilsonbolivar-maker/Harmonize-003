name: Publicar no Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  netlify:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: f35fa40b-0402-4184-965b-4a5a340a484e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Enviar para o Netlify
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: npx -y netlify-cli@latest deploy --prod --dir=dist --no-build
      - name: Aviso
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: echo "Falta o segredo NETLIFY_AUTH_TOKEN no GitHub."
